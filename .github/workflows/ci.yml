name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # Scan the whole history with the gitleaks CLI. (The gitleaks Action scans only the pushed range, which
      # breaks after a force push, when the push's "before" commit no longer exists.)
      - name: gitleaks (full history)
        env: { GITLEAKS_VERSION: "8.21.2" }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      AMA_FAKE_LLM: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check src tests
      - run: pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ama_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AMA_FAKE_LLM: "true"
      AMA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ama_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_postgres.py
