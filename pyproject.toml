[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "artificialmoralagent"
dynamic = ["version"]
description = "Structured ethical analysis across four frameworks and a Chief Moral Arbiter - web app, REST API and MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The ArtificialMoralAgent authors" }]
keywords = ["ethics", "moral reasoning", "llm", "mcp", "ai safety", "decision support"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ama = "ama.cli:main"

[project.urls]
Homepage = "https://github.com/tgreenhaw5/ArtificialMoralAgent"
Documentation = "https://github.com/tgreenhaw5/ArtificialMoralAgent/tree/main/docs"
Issues = "https://github.com/tgreenhaw5/ArtificialMoralAgent/issues"

[tool.hatch.version]
path = "src/ama/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM105", "SIM118", "E741", "B905"]   # B008: FastAPI Depends(); SIM118: sqlite3.Row needs .keys()
